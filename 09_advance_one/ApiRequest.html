<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div class="card" style="text-align: center;">
        <img src="imageurl.com" style="width: 100px; height: 100px;">
    <div id="repository">
        <h3>Madhur Anand</h3>
    </div>
    </div>
</body>
<script>
    let imgurl
    let repos
    const reqURL = 'https://api.github.com/users/heymadhurhere'
    const xhr = new XMLHttpRequest()
    xhr.open('GET', reqURL)
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            const data = JSON.parse(this.responseText)
            imgurl = data.avatar_url
            repos = data.public_repos

            document.querySelector("img").setAttribute("src", `${imgurl}`);
            document.querySelector("h3").innerHTML = `Public Repos: ${repos}`
        }
    }
    xhr.send()

</script>
</html>
